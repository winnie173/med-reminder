<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="💊吃药提醒">
<meta name="theme-color" content="#667eea">
<meta name="mobile-web-app-capable" content="yes">
<title>💊 吃药提醒</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #667eea;
  --primary-dark: #5a6fd6;
  --bg-start: #667eea;
  --bg-end: #764ba2;
  --card-bg: rgba(255,255,255,.95);
  --success: #27ae60;
  --warning: #e67e22;
  --danger: #e74c3c;
  --text: #333;
  --text-light: #888;
}
html, body {
  height: 100%; overflow-x: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-end) 100%);
  color: var(--text);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

.container {
  max-width: 460px; margin: 0 auto;
  min-height: 100vh; padding: 0 16px 24px;
  display: flex; flex-direction: column;
}

/* 头部 */
.header {
  text-align: center; padding: 20px 0 12px;
}
.header h1 {
  font-size: 24px; color: white; font-weight: 700;
  text-shadow: 0 2px 8px rgba(0,0,0,.2);
}

/* Tab 切换 */
.tab-bar {
  display:flex; background:rgba(255,255,255,.18); border-radius:14px;
  padding:3px; margin-bottom:14px;
}
.tab-btn {
  flex:1; border:none; background:transparent; color:rgba(255,255,255,.8);
  font-size:14px; font-weight:600; padding:10px 0; border-radius:11px;
  cursor:pointer; transition:all .25s; position:relative;
}
.tab-btn.active { background:white; color:var(--primary); box-shadow:0 2px 8px rgba(0,0,0,.12); }

/* 页面区域 */
.page { display:none; }
.page.active { display:block; animation: fadeIn .3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* ===== 今日页 ===== */

/* 主状态卡片 */
.main-card {
  background: var(--card-bg); border-radius: 20px; padding: 16px;
  margin-bottom: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.15);
  text-align: center; position: relative; overflow: hidden;
}
.main-card::before {
  content:''; position:absolute; top:-40%; right:-30%; width:140px; height:140px;
  border-radius:50%; background:rgba(102,126,234,.08);
}
.clock-date { font-size: 13px; color: var(--text-light); }
.clock-time {
  font-size: 42px; font-weight: 800; letter-spacing: 2px;
  color: var(--text); line-height: 1.15; margin: 4px 0;
  font-variant-numeric: tabular-nums;
}
.status-badge {
  display:inline-block; padding: 5px 14px; border-radius: 16px;
  font-size: 13px; font-weight: 600;
}
.status-badge.morning { background:#fff3e0; color:#e65100; }
.status-badge.daytime { background:#e8f5e9; color:#2e7d32; }
.status-badge.evening { background:#ede7f6; color:#512da8; }

/* 倒计时 */
.countdown-card {
  background: var(--card-bg); border-radius: 16px; padding: 14px;
  margin-bottom: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.1);
  display:flex; align-items:center; justify-content:center; gap:12px;
}
.countdown-label { font-size:12px; color:var(--text-light); white-space:nowrap; }
.countdown-num {
  font-size:28px; font-weight:800; color:var(--primary);
  font-variant-numeric: tabular-nums; letter-spacing:1px;
}

/* 药品卡片 */
.med-section {
  background: var(--card-bg); border-radius: 16px; padding: 14px;
  margin-bottom: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.1);
}
.section-header {
  display:flex; align-items:center; gap:8px; margin-bottom:10px;
  padding-bottom:8px; border-bottom:2px solid #f5f5f5;
}
.section-header .emoji { font-size:20px; }
.section-header .title { font-size:15px; font-weight:700; flex:1; }
.section-header .time-hint { font-size:11px; color:var(--text-light); background:#f5f5f5; padding:2px 8px; border-radius:8px; }

.med-row {
  display:flex; align-items:center; padding:8px 4px;
  border-bottom:1px solid #f8f8f8;
}
.med-row:last-child { border:none; }
.med-left { flex:1; }
.med-name { font-size:15px; font-weight:600; }
.med-dose { font-size:12px; color:var(--text-light); margin-top:2px; }
.med-note { font-size:11px; color:#bbb; margin-top:2px; line-height:1.4; }

/* 打卡按钮 */
.check-btn {
  width:44px; height:44px; border-radius:50%; border:none;
  font-size:22px; cursor:pointer; transition:all .25s cubic-bezier(.4,2,.2,1);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.check-btn.off { background:#f0f0f0; color:#ccc; }
.check-btn.on { background:var(--success); color:white; transform:scale(1.06); box-shadow:0 3px 12px rgba(39,174,96,.35); }
.check-btn.late { background:var(--warning); color:white; }
.check-btn:active { transform: scale(0.9); }

/* 进度 */
.progress-wrap { margin-top:auto; padding-top:10px; }
.progress-info { display:flex; justify-content:space-between; font-size:12px; color:rgba(255,255,255,.85); margin-bottom:6px; }
.progress-track {
  height:8px; background:rgba(255,255,255,.25); border-radius:4px; overflow:hidden;
}
.progress-bar {
  height:100%; border-radius:4px; transition:width .5s ease;
  background:linear-gradient(90deg,#a8edea,#fed6e3);
}

/* ===== 日历页 ===== */
.cal-card {
  background:var(--card-bg); border-radius:20px; padding:16px;
  margin-bottom:14px; box-shadow:0 6px 24px rgba(0,0,0,.12);
}
.cal-nav {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:14px;
}
.cal-nav button {
  width:36px; height:36px; border-radius:50%; border:none; background:#f5f5f5;
  font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:background .2s;
}
.cal-nav button:active { background:#e0e0e0; }
.cal-month-label { font-size:17px; font-weight:700; color:var(--text); }

.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; }
.cal-head { font-size:11px; color:var(--text-light); padding:6px 0; font-weight:600; }
.cal-head.weekend { color:var(--danger); }
.cal-day {
  aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  border-radius:50%; font-size:14px; font-weight:500; cursor:pointer;
  position:relative; transition:all .2s; user-select:none;
}
.cal-day.other-month { color:#ccc; }
.cal-day.today { font-weight:800; color:var(--primary); }
.cal-day.selected { background:var(--primary); color:white; }
.cal-day:hover:not(.other-month):not(.selected) { background:#f0f0f0; }
/* 日历上的圆点标记 */
.cal-day .dots {
  position:absolute; bottom:2px; left:50%; transform:translateX(-50%);
  display:flex; gap:2px;
}
.cal-day .dot {
  width:5px; height:5px; border-radius:50%;
}
.dot.full { background:var(--success); }
.dot.partial { background:var(--warning); }
.dot.none { background:#ddd; }

/* 选中日期详情 */
.date-detail {
  background:var(--card-bg); border-radius:16px; padding:14px;
  margin-bottom:14px; box-shadow:0 4px 20px rgba(0,0,0,.1);
}
.detail-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:12px;
}
.detail-title { font-size:15px; font-weight:700; }
.detail-status { font-size:12px; padding:3px 10px; border-radius:10px; font-weight:600; }
.detail-status.done { background:#e8f5e9; color:#2e7d32; }
.detail-status.partial { background:#fff3e0; color:#e65100; }
.detail-status.missed { background:#fce4ec; color:#c62828; }
.detail-status.empty { background:#f5f5f5; color:#999; }

.detail-med-row {
  display:flex; align-items:center; padding:8px 4px;
  border-bottom:1px solid #f8f8f8;
}
.detail-med-row:last-child { border:none; }
.detail-med-info { flex:1; }
.detail-med-name { font-size:14px; font-weight:600; }
.detail-med-time { font-size:11px; color:var(--text-light); }
.detail-check-btn {
  width:38px; height:38px; border-radius:50%; border:none;
  font-size:18px; cursor:pointer; transition:all .25s;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.detail-check-btn.off { background:#f0f0f0; color:#ccc; }
.detail-check-btn.on { background:var(--success); color:white; }
.detail-check-btn.late { background:var(--warning); color:white; }

/* 统计卡 */
.stats-row {
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:14px;
}
.stat-item {
  background:var(--card-bg); border-radius:14px; padding:12px 8px;
  text-align:center; box-shadow:0 4px 16px rgba(0,0,0,.1);
}
.stat-num { font-size:24px; font-weight:800; color:var(--primary); }
.stat-label { font-size:11px; color:var(--text-light); margin-top:2px; }

/* 安装提示 */
.install-banner {
  background:rgba(255,255,255,.95); border-radius:14px; padding:12px 14px;
  margin-bottom:12px; display:flex; align-items:center; gap:10px;
  box-shadow:0 4px 16px rgba(0,0,0,.1);
}
.install-banner .ib-icon { font-size:28px; }
.install-banner .ib-text { flex:1; }
.install-banner .ib-title { font-size:13px; font-weight:600; }
.install-banner .ib-desc { font-size:10px; color:var(--text-light); margin-top:2px; }
.install-banner .ib-btn {
  background:var(--primary); color:white; border:none; padding:7px 14px;
  border-radius:10px; font-size:12px; font-weight:600; cursor:pointer;
  white-space:nowrap;
}

/* 完成庆祝 */
.celebrate-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.45);
  display:flex; align-items:center; justify-content:center; z-index:100;
  opacity:0; pointer-events:none; transition:opacity .3s;
}
.celebrate-overlay.show { opacity:1; pointer-events:auto; }
.celebrate-card {
  background:white; border-radius:24px; padding:32px 36px; text-align:center;
  transform:scale(.8); transition:transform .35s cubic-bezier(.175,.885,.32,1.275);
}
.celebrate-overlay.show .celebrate-card { transform:scale(1); }
.celebrate-emoji { font-size:48px; margin-bottom:10px; }
.celebrate-text { font-size:18px; font-weight:700; color:var(--text); }
.celebrate-sub { font-size:13px; color:var(--text-light); margin-top:6px; }

/* Toast */
.toast {
  position:fixed; top:60px; left:50%; transform:translateX(-50%) translateY(-20px);
  background:rgba(0,0,0,.78); color:white; padding:10px 24px;
  border-radius:14px; font-size:14px; z-index:200;
  opacity:0; transition:all .3s ease; white-space:nowrap;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

.safe-bottom { height:env(safe-area-inset-bottom); }

@media (max-width:380px) {
  .clock-time { font-size:36px; }
  .countdown-num { font-size:24px; }
  .header h1 { font-size:20px; }
  .stat-num { font-size:20px; }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>💊 吃药提醒</h1>
  </div>

  <!-- Tab 切换 -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('today')">📋 今日</button>
    <button class="tab-btn" onclick="switchTab('calendar')">📅 日历</button>
  </div>

  <!-- ========== 今日页 ========== -->
  <div class="page active" id="pageToday">

    <!-- 安装提示 -->
    <div class="install-banner" id="installBanner">
      <span class="ib-icon">📲</span>
      <div class="ib-text">
        <div class="ib-title">添加到主屏幕（像App一样用）</div>
        <div class="ib-desc" id="installDesc">正在检测安装方式...</div>
      </div>
      <button class="ib-btn" id="installBtn">安装</button>
    </div>

    <!-- 主状态 -->
    <div class="main-card">
      <div class="clock-date" id="dateLabel"></div>
      <div class="clock-time" id="clockTime"></div>
      <div class="status-badge" id="statusBadge"></div>
    </div>

    <!-- 倒计时 -->
    <div class="countdown-card">
      <span class="countdown-label">⏰ 下次提醒</span>
      <span class="countdown-num" id="countdownNum">--:--:--</span>
    </div>

    <!-- 🌅 早上药 -->
    <div class="med-section">
      <div class="section-header">
        <span class="emoji">🌅</span>
        <span class="title">早上服药</span>
        <span class="time-hint">9:00 前</span>
      </div>
      <div class="med-row">
        <div class="med-left">
          <div class="med-name">艾司西酞普兰</div>
          <div class="med-dose">10 mg · 每日一次</div>
        </div>
        <button class="check-btn off" id="btn_m_esc" onclick="doCheck('m','escitalopram')">○</button>
      </div>
    </div>

    <!-- 🌙 晚上药 -->
    <div class="med-section">
      <div class="section-header">
        <span class="emoji">🌙</span>
        <span class="title">晚上服药</span>
        <span class="time-hint">22:00 前</span>
      </div>
      <div class="med-row">
        <div class="med-left">
          <div class="med-name">奥氮平</div>
          <div class="med-dose">2.5 mg 起（每3天+2.5mg → 最高10mg）</div>
        </div>
        <button class="check-btn off" id="btn_e_ola" onclick="doCheck('e','olanzapine')">○</button>
      </div>
      <div class="med-row">
        <div class="med-left">
          <div class="med-name">米氮平</div>
          <div class="med-dose">15 mg（1周后可加到30mg）</div>
        </div>
        <button class="check-btn off" id="btn_e_mir" onclick="doCheck('e','mirtazapine')">○</button>
      </div>
    </div>

    <!-- 进度 -->
    <div class="progress-wrap">
      <div class="progress-info">
        <span>今日进度</span>
        <span id="progressText">0 / 3</span>
      </div>
      <div class="progress-track"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    </div>
  </div>

  <!-- ========== 日历页 ========== -->
  <div class="page" id="pageCalendar">

    <!-- 本月统计 -->
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-num" id="statFull">0</div>
        <div class="stat-label">✅ 全部完成</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="statPartial">0</div>
        <div class="stat-label">⚠️ 部分完成</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="statMissed">0</div>
        <div class="stat-label">❌ 未服药</div>
      </div>
    </div>

    <!-- 日历 -->
    <div class="cal-card">
      <div class="cal-nav">
        <button onclick="calMove(-1)">◀</button>
        <div class="cal-month-label" id="calMonthLabel"></div>
        <button onclick="calMove(1)">▶</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <!-- 选中日期详情 & 补卡 -->
    <div class="date-detail" id="dateDetail">
      <div class="detail-header">
        <div class="detail-title" id="detailTitle">选择一个日期查看/补卡</div>
        <div class="detail-status empty" id="detailStatus"></div>
      </div>
      <div id="detailBody"></div>
    </div>
  </div>

  <div class="safe-bottom"></div>
</div>

<!-- 庆祝弹窗 -->
<div class="celebrate-overlay" id="celebrateOverlay" onclick="this.classList.remove('show')">
  <div class="celebrate-card">
    <div class="celebrate-emoji" id="celeEmoji">🎉</div>
    <div class="celebrate-text" id="celeText">太棒了！</div>
    <div class="celebrate-sub" id="celeSub">今天的药都吃完了~</div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ========== 数据层 ==========
const SKEY = 'med_v3';
const MEDS = [
  { group:'m', id:'escitalopram', name:'艾司西酞普兰', dose:'10 mg', timeHint:'早上 9:00 前' },
  { group:'e', id:'olanzapine',     name:'奥氮平',       dose:'2.5 mg 起', timeHint:'晚上 22:00 前' },
  { group:'e', id:'mirtazapine',    name:'米氮平',       dose:'15 mg', timeHint:'晚上 22:00 前' },
];

function load(){ try{ return JSON.parse(localStorage.getItem(SKEY))||{}; }catch(e){return{};} }
function save(d){ localStorage.setItem(SKEY,JSON.stringify(d)); }

function dateStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayStr(){ return dateStr(new Date()); }
function mkey(g,id){ return g+'_'+id; }

function isOn(dateStr,g,id){
  const d=load(); return !!(d[dateStr]&&d[dateStr][mkey(g,id)]);
}
function flipOn(dateStr,g,id){
  const d=load();
  if(!d[dateStr]) d[dateStr]={};
  d[dateStr][mkey(g,id)] = !(d[dateStr][mkey(g,id)]);
  save(d);
  return d[dateStr][mkey(g,id)];
}
function getDayData(ds){
  const d=load(); return d[ds]||{};
}
function getDayStatus(ds){
  const data=getDayData(ds);
  let done=0, total=MEDS.length;
  MEDS.forEach(m=>{ if(data[mkey(m.group,m.id)]) done++; });
  if(done===0) return 'empty';
  if(done===total) return 'done';
  return 'partial';
}

// ========== Tab 切换 ==========
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active', (tab==='today'&&i===0)||(tab==='calendar'&&i===1));
  });
  document.getElementById('pageToday').classList.toggle('active',tab==='today');
  document.getElementById('pageCalendar').classList.toggle('active',tab==='calendar');
  if(tab==='calendar'){ renderCalendar(); updateStats(); }
}

// ========== 今日页 UI ==========
function refreshBtn(g,id,btnId){
  const btn=document.getElementById(btnId);
  const on = isOn(todayStr(),g,id);
  // 判断是否迟到
  const now=new Date(), h=now.getHours(), m=now.getMinutes();
  const isLate = (g==='m'&&h>=12) || (g==='e'&&h>=23||(h>=0&&h<6));
  if(on){
    btn.className='check-btn on'; btn.textContent='✓';
  } else if(isLate && !on){
    btn.className='check-btn late'; btn.textContent='！';
  } else {
    btn.className='check-btn off'; btn.textContent='○';
  }
}
function refreshAll(){
  refreshBtn('m','escitalopram','btn_m_esc');
  refreshBtn('e','olanzapine','btn_e_ola');
  refreshBtn('e','mirtazapine','btn_e_mir');
  updateProgress();
}

function doCheck(g,id){
  const on=flipOn(todayStr(),g,id);
  if(g==='m') refreshBtn('m','escitalopram','btn_m_esc');
  else if(id==='olanzapine') refreshBtn('e','olanzapine','btn_e_ola');
  else refreshBtn('e','mirtazapine','btn_e_mir');
  updateProgress();
  if(on && navigator.vibrate) navigator.vibrate([40,20,40]);
  showToast(on ? '✅ 已记录' : '↩️ 已取消');
  checkCelebrate();
}

function updateProgress(){
  let n=0;
  MEDS.forEach(m=>{ if(isOn(todayStr(),m.group,m.id)) n++; });
  document.getElementById('progressBar').style.width=(n/MEDS.length*100)+'%';
  document.getElementById('progressText').textContent=n+' / '+MEDS.length;
}

// ========== 时钟 & 状态 ==========
const WEEKDAYS=['周日','周一','周二','周三','周四','周五','周六'];
function tick(){
  const now=new Date();
  const h=now.getHours(), m=now.getMinutes(), s=now.getSeconds();

  document.getElementById('dateLabel').textContent =
    now.getMonth()+1+'月'+now.getDate()+'日 '+WEEKDAYS[now.getDay()];
  document.getElementById('clockTime').textContent =
    String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');

  const total=h*60+m;
  const badge=document.getElementById('statusBadge');
  if(total<9*60){
    badge.textContent='🌅 早上吃药时间'; badge.className='status-badge morning';
  } else if(total<22*60){
    badge.textContent='☀️ 白天时段'; badge.className='status-badge daytime';
  } else {
    badge.textContent='🌙 晚上吃药时间'; badge.className='status-badge evening';
  }
  countdown(h,m,s);

  // 更新迟到标记
  refreshAll();
}

function countdown(h,m,s){
  const total=h*60+m;
  let target;
  if(total<9*60) target=9;
  else if(total<22*60) target=22;
  else target=33;

  let diff=target*60-total;
  if(diff<=0) diff+=24*60;

  const hh=Math.floor(diff/60), mm=diff%60, ss=(59-s)%60;
  document.getElementById('countdownNum').textContent=
    String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0'));
}

// ========== 庆祝 ==========
function checkCelebrate(){
  const allDone=MEDS.every(m=>isOn(todayStr(),m.group,m.id));
  if(!allDone) return;
  const now=new Date(), total=now.getHours()*60+now.getMinutes();
  const morningDone=isOn(todayStr(),'m','escitalopram');
  const eveningDone=isOn(todayStr(),'e','olanzapine')&&isOn(todayStr(),'e','mirtazapine');

  if(total>=9*60&&total<22*60&&morningDone){
    showCelebrate('🌅','早上药吃完啦！','下午继续加油~');
  } else if(total>=22*60&&eveningDone){
    showCelebrate('🎉','今天全部完成！','好好休息，晚安💤');
  }
}
function showCelebrate(emoji,text,sub){
  document.getElementById('celeEmoji').textContent=emoji;
  document.getElementById('celeText').textContent=text;
  document.getElementById('celeSub').textContent=sub;
  const o=document.getElementById('celebrateOverlay');
  o.classList.add('show');
  setTimeout(()=>o.classList.remove('show'),3000);
}

// ========== Toast ==========
let toastTimer=null;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}

// ========== 日历 ==========
let calYear, calMonth, calSelectedDate=null;

function renderCalendar(){
  if(calYear==null){
    const t=new Date(); calYear=t.getFullYear(); calMonth=t.getMonth();
  }
  const firstDay=new Date(calYear,calMonth,1);
  const lastDay=new Date(calYear,calMonth+1,0);
  const startDow=(firstDay.getDay()+7)%7; // 周一开始=0
  const todayT=todayStr();

  const months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calMonthLabel').textContent=calYear+'年 '+months[calMonth];

  const heads=['一','二','三','四','五','六','日'];
  let html='<div class="cal-head">一</div><div class="cal-head">二</div><div class="cal-head">三</div>'+
           '<div class="cal-head">四</div><div class="cal-head">五</div><div class="cal-head weekend">六</div><div class="cal-head weekend">日</div>';

  // 上月填充
  const prevLast=new Date(calYear,calMonth,0).getDate();
  for(let i=startDow-1;i>=0;i--){
    html+='<div class="cal-day other-month">'+(prevLast-i)+'</div>';
  }

  // 本月
  for(let d=1;d<=lastDay.getDate();d++){
    const ds=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday=ds===todayT;
    const isSelected=ds===calSelectedDate;
    const status=getDayStatus(ds);

    let cls='cal-day';
    if(isToday) cls+=' today';
    if(isSelected) cls+=' selected';

    // 圆点
    let dotsHtml='';
    if(status!=='empty'){
      dotsHtml='<div class="dots">'+(status==='done'
        ? '<div class="dot full"></div><div class="dot full"></div>'
        : '<div class="dot partial"></div>')+'</div>';
    }

    html+='<div class="'+cls+'" onclick="selectDate(\''+ds+'\')">'+d+dotsHtml+'</div>';
  }

  // 下月填充
  const totalCells=startDow+lastDay.getDate();
  const remaining=(7-totalCells%7)%7;
  for(let i=1;i<=remaining;i++) html+='<div class="cal-day other-month">'+i+'</div>';

  document.getElementById('calGrid').innerHTML=html;
}

function calMove(dir){
  calMonth+=dir;
  if(calMonth>11){ calMonth=0; calYear++; }
  if(calMonth<0){ calMonth=11; calYear--; }
  renderCalendar();
}

function selectDate(ds){
  calSelectedDate=ds;
  renderCalendar();
  renderDateDetail(ds);
}

function renderDateDetail(ds){
  const parts=ds.split('-');
  const d=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
  const wd=WEEKDAYS[d.getDay()];
  const status=getDayStatus(ds);

  document.getElementById('detailTitle').textContent=
    parseInt(parts[1])+'月'+parseInt(parts[2])+'日 '+wd;

  const statusEl=document.getElementById('detailStatus');
  statusEl.className='detail-status '+status;
  const statusText={done:'✅ 全部完成',partial:'⚠️ 部分完成',missed:'❌ 未服药',empty:'— 无记录'};
  statusEl.textContent=statusText[status];

  // 药品列表 + 补卡按钮
  let bodyHtml='';
  MEDS.forEach(m=>{
    const on=isOn(ds,m.group,m.id);
    const isPast=ds<todayStr();
    const cls=on?'on':'off';

    bodyHtml+='<div class="detail-med-row">'+
      '<div class="detail-med-info">'+
        '<div class="detail-med-name">'+(m.group==='m'?'🌅':'🌙')+' '+m.name+'</div>'+
        '<div class="detail-med-time">'+m.timeHint+' · '+m.dose+'</div>'+
      '</div>'+
      '<button class="detail-check-btn '+cls+'" onclick="doCheckDate(\''+ds+'\''+\',\''+m.group+'\',\''+m.id+'\')">'+
        (on?'✓':'○')+
      '</button>'+
    '</div>';
  });

  document.getElementById('detailBody').innerHTML=bodyHtml;
}

function doCheckDate(ds,g,id){
  const on=flipOn(ds,g,id);
  renderDateDetail(ds);
  renderCalendar();
  updateStats();
  showToast(on ? '✅ '+ds+' 已补卡' : '↩️ 已取消');
  // 如果是今天，同步更新今日页
  if(ds===todayStr()) refreshAll();
}

// ========== 统计 ==========
function updateStats(){
  let fullCount=0, partialCount=0, missedCount=0;
  // 遍历本月
  const lastDay=new Date(calYear,calMonth+1,0).getDate();
  const todayT=new Date();
  for(let d=1;d<=lastDay;d++){
    const ds=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    // 只统计今天及之前的日期
    if(ds>todayStr()) continue;
    const st=getDayStatus(ds);
    if(st==='done') fullCount++;
    else if(st==='partial') partialCount++;
    else if(st==='empty') missedCount++;
  }
  document.getElementById('statFull').textContent=fullCount;
  document.getElementById('statPartial').textContent=partialCount;
  document.getElementById('statMissed').textContent=missedCount;
}

// ========== 通知 ==========
function setupNotif(){
  if(!('Notification'in window)) return;
  if(Notification.permission==='default') Notification.requestPermission();
  if(Notification.permission!=='granted') return;

  function fire(title,body){
    const n=new Notification(title,{body,icon:'icon-192.png',badge:'icon-192.png',
      vibrate:[200,100,200],tag:'med'});
    setTimeout(()=>n.close(),8000);
  }
  function sched(targetH,title,body){
    let t=new Date(); t.setHours(targetH,0,0,0);
    if(t<=new Date()) t.setDate(t.getDate()+1);
    setTimeout(()=>fire(title,body),t-new Date());
  }
  sched(9,'💊 该吃早上的药了！','艾司西酞普兰 10mg');
  sched(22,'💊 该吃晚上的药了！','奥氮平 + 米氮平');
}

// ========== PWA 安装 ==========
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  document.getElementById('installDesc').textContent='点击右侧「安装」按钮即可';
});
document.getElementById('installBtn').addEventListener('click',async()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();
    const r=await deferredPrompt.userChoice;
    deferredPrompt=null;
    document.getElementById('installBanner').style.display='none';
    if(r.outcome==='accepted') showToast('🎉 已添加到主屏幕！');
    return;
  }
  showInstallGuide();
});

function showInstallGuide(){
  const ua=navigator.userAgent.toLowerCase();
  let guide='';
  if(ua.includes('oppo')||ua.includes('heytap'))
    guide='①浏览器菜单→②找"添加到桌面"→③找不到请用Chrome打开本页';
  else if(ua.includes('chrome'))
    guide='①右上角⋮→②添加到主屏幕→③确认';
  else if(ua.includes('safari'))
    guide='①分享📤→②添加到主屏幕→③确认';
  else
    guide='①浏览器菜单→②找"添加到桌面"→③推荐用Chrome';
  document.getElementById('installDesc').textContent=guide;
  showToast('👇 看下方操作步骤');
}

// ========== 启动 ==========
refreshAll();
tick();
setInterval(tick,1000);
setupNotif();

// 默认选中今天
calSelectedDate=todayStr();

setTimeout(()=>{
  if(!deferredPrompt) showInstallGuide();
},2000);
