<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="💊吃药提醒">
<meta name="theme-color" content="#667eea">
<title>💊 吃药提醒</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:linear-gradient(160deg,#667eea,#764ba2);color:#333;padding:10px;min-height:100vh}
.wrap{max-width:440px;margin:0 auto}

/* 标题 */
.title{color:#fff;text-align:center;font-size:22px;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.2);padding:16px 0 10px}

/* TAB */
.tabs{display:flex;background:rgba(255,255,255,.2);border-radius:12px;padding:3px;margin-bottom:12px}
.tab{flex:1;border:none;background:none;color:rgba(255,255,255,.85);font-size:14px;font-weight:600;padding:9px 0;border-radius:10px;cursor:pointer}
.tab.on{background:#fff;color:#667eea;box-shadow:0 2px 6px rgba(0,0,0,.1)}

/* 页面 */
.pane{display:none}
.pane.show{display:block}

/* 卡片 */
.card{background:rgba(255,255,255,.95);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 4px 20px rgba(0,0,0,.1)}

/* 时钟 */
.clock-c{text-align:center}
.clock-d{font-size:12px;color:#888}
.clock-t{font-size:40px;font-weight:800;color:#333;letter-spacing:2px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:5px 14px;border-radius:14px;font-size:13px;font-weight:600;margin-top:4px}
.badge.am{background:#fff3e0;color:#e65100}
.badge.day{background:#e8f5e9;color:#2e7d32}
.badge.pm{background:#ede7f6;color:#512da8}

/* 倒计时 */
.cd-row{display:flex;align-items:center;justify-content:center;gap:12px}
.cd-lbl{font-size:12px;color:#888}
.cd-num{font-size:26px;font-weight:800;color:#667eea;letter-spacing:1px}

/* 药品区 */
.sec-title{display:flex;align-items:center;gap:6px;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid #f0f0f0}
.sec-title .emo{font-size:18px}
.sec-title .name{font-size:14px;font-weight:700;flex:1}
.sec-title .hint{font-size:11px;color:#888;background:#f5f5f5;padding:2px 8px;border-radius:8px}

.med-item{display:flex;align-items:center;padding:8px 2px;border-bottom:1px solid #fafafa}
.med-item:last-child{border:none}
.med-info{flex:1}
.med-n{font-size:15px;font-weight:600}
.med-d{font-size:12px;color:#888;margin-top:1px}

/* 按钮 */
.btn{width:42px;height:42px;border-radius:50%;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.btn-no{background:#f0f0f0;color:#ccc}
.btn-yes{background:#27ae60;color:#fff;transform:scale(1.06);box-shadow:0 3px 10px rgba(39,174,96,.3)}
.btn-late{background:#e67e22;color:#fff}
.btn:active{transform:scale(.88)}

/* 进度条 */
.prog{margin-top:8px}
.prog-info{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.85);margin-bottom:4px}
.prog-bar{height:7px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#a8edea,#fed6e3);transition:width .4s}

/* ===== 日历页 ===== */

/* 统计 */
.stats{display:flex;gap:8px;margin-bottom:10px}
.st{flex:1;background:rgba(255,255,255,.95);border-radius:12px;padding:10px 6px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.st-n{font-size:22px;font-weight:800;color:#667eea}
.st-l{font-size:10px;color:#888;margin-top:2px}

/* 日历 */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav button{width:34px;height:34px;border-radius:50%;border:none;background:#f0f0f0;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-nav button:active{background:#ddd}
.cal-title{font-size:16px;font-weight:700;color:#333}

/* 日历表格 - 用table保证兼容性 */
.cal-table{width:100%;border-collapse:collapse;table-layout:fixed}
.cal-table th{font-size:11px;color:#888;padding:5px 0;font-weight:600}
.cal-table th.we{color:#e74c3c}
.cal-table td{text-align:center;padding:4px 0;position:relative}
.cal-cell{display:block;width:36px;height:36px;line-height:36px;margin:0 auto;border-radius:50%;font-size:14px;cursor:pointer;color:#333;position:relative}
.cal-cell.gray{color:#ccc}
.cal-cell.today{font-weight:800;color:#667eea}
.cal-cell.sel{background:#667eea;color:#fff}
.cal-dot{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.dot-ok{width:5px;height:5px;border-radius:50%;background:#27ae60}
.dot-py{width:5px;height:5px;border-radius:50%;background:#e67e22}

/* 日期详情 */
.detail{background:rgba(255,255,255,.95);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.d-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.d-title{font-size:14px;font-weight:700}
.d-st{font-size:11px;padding:2px 8px;border-radius:8px;font-weight:600}
.d-st-ok{background:#e8f5e9;color:#2e7d32}
.d-st-py{background:#fff3e0;color:#e65100}
.d-st-no{background:#fce4ec;color:#c62828}
.d-st-ep{background:#f5f5f5;color:#999}

.d-item{display:flex;align-items:center;padding:7px 2px;border-bottom:1px solid #fafafa}
.d-item:last-child{border:none}
.d-info{flex:1}
.d-name{font-size:13px;font-weight:600}
.d-time{font-size:10px;color:#888}
.d-btn{width:36px;height:36px;border-radius:50%;border:none;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.d-btn-no{background:#f0f0f0;color:#ccc}
.d-btn-yes{background:#27ae60;color:#fff}
.d-btn:active{transform:scale(.88)}

/* 安装提示 */
.install{background:rgba(255,255,255,.95);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.install .i-ico{font-size:24px}
.install .i-txt{flex:1}
.install .i-tit{font-size:13px;font-weight:600}
.install .i-desc{font-size:10px;color:#888;margin-top:1px}
.install .i-go{background:#667eea;color:#fff;border:none;padding:6px 14px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer}

/* 庆祝弹窗 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:auto}
.ov-card{background:#fff;border-radius:20px;padding:28px 32px;text-align:center;transform:scale(.8);transition:transform .35s}
.overlay.show .ov-card{transform:scale(1)}
.ov-emo{font-size:44px;margin-bottom:8px}
.ov-txt{font-size:18px;font-weight:700}
.ov-sub{font-size:13px;color:#888;margin-top:4px}

/* Toast */
.toast{position:fixed;top:55px;left:50%;transform:translateX(-50%) translateY(-15px);background:rgba(0,0,0,.78);color:#fff;padding:10px 22px;border-radius:12px;font-size:14px;z-index:200;opacity:0;transition:all .3s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.safe{height:20px}
</style>
</head>
<body>

<div class="wrap">

<div class="title">💊 吃药提醒</div>

<!-- TAB -->
<div class="tabs">
  <button class="tab on" id="tabToday" onclick="goTab('today')">📋 今日</button>
  <button class="tab" id="tabCal" onclick="goTab('cal')">📅 日历</button>
</div>

<!-- ========== 今日页 ========== -->
<div class="pane show" id="paneToday">

  <!-- 安装提示 -->
  <div class="install" id="installBox">
    <div class="i-ico">📲</div>
    <div class="i-txt">
      <div class="i-tit">添加到主屏幕</div>
      <div class="i-desc" id="installDesc">正在检测...</div>
    </div>
    <button class="i-go" id="installBtn">安装</button>
  </div>

  <!-- 时钟 -->
  <div class="card clock-c">
    <div class="clock-d" id="clkDate"></div>
    <div class="clock-t" id="clkTime"></div>
    <div class="badge am" id="clkBadge"></div>
  </div>

  <!-- 倒计时 -->
  <div class="card">
    <div class="cd-row">
      <span class="cd-lbl">⏰ 下次提醒</span>
      <span class="cd-num" id="cdNum">--:--:--</span>
    </div>
  </div>

  <!-- 早上药 -->
  <div class="card">
    <div class="sec-title"><span class="emo">🌅</span><span class="name">早上服药</span><span class="hint">9:00 前</span></div>
    <div class="med-item">
      <div class="med-info"><div class="med-n">艾司西酞普兰</div><div class="med-d">10 mg · 每日一次</div></div>
      <button class="btn btn-no" id="b_m_esc" onclick="chk('m','escitalopram')">○</button>
    </div>
  </div>

  <!-- 晚上药 -->
  <div class="card">
    <div class="sec-title"><span class="emo">🌙</span><span class="name">晚上服药</span><span class="hint">22:00 前</span></div>
    <div class="med-item">
      <div class="med-info"><div class="med-n">奥氮平</div><div class="med-d">2.5 mg 起（每3天+2.5mg → 最高10mg）</div></div>
      <button class="btn btn-no" id="b_e_ola" onclick="chk('e','olanzapine')">○</button>
    </div>
    <div class="med-item">
      <div class="med-info"><div class="med-n">米氮平</div><div class="med-d">15 mg（1周后可加到30mg）</div></div>
      <button class="btn btn-no" id="b_e_mir" onclick="chk('e','mirtazapine')">○</button>
    </div>
  </div>

  <!-- 进度 -->
  <div class="prog">
    <div class="prog-info"><span>今日进度</span><span id="progTxt">0 / 3</span></div>
    <div class="prog-bar"><div class="prog-fill" id="progBar" style="width:0%"></div></div>
  </div>
</div>

<!-- ========== 日历页 ========== -->
<div class="pane" id="paneCal">

  <!-- 统计 -->
  <div class="stats">
    <div class="st"><div class="st-n" id="stOk">0</div><div class="st-l">✅ 全部完成</div></div>
    <div class="st"><div class="st-n" id="stPy">0</div><div class="st-l">⚠️ 部分完成</div></div>
    <div class="st"><div class="st-n" id="stNo">0</div><div class="st-l">❌ 未服药</div></div>
  </div>

  <!-- 日历 -->
  <div class="card">
    <div class="cal-nav">
      <button onclick="calGo(-1)">◀</button>
      <div class="cal-title" id="calTitle"></div>
      <button onclick="calGo(1)">▶</button>
    </div>
    <table class="cal-table">
      <thead><tr><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th class="we">六</th><th class="we">日</th></tr></thead>
      <tbody id="calBody"></tbody>
    </table>
  </div>

  <!-- 详情 & 补卡 -->
  <div class="detail" id="detailBox">
    <div class="d-head">
      <div class="d-title" id="dTt">点选日期查看 / 补卡</div>
      <div class="d-st d-st-ep" id="dSt"></div>
    </div>
    <div id="dBd"></div>
  </div>

</div>

<div class="safe"></div>
</div>

<!-- 庆祝 -->
<div class="overlay" id="overlay" onclick="this.classList.remove('show')">
  <div class="ov-card">
    <div class="ov-emo" id="ovEmo">🎉</div>
    <div class="ov-txt" id="ovTxt">太棒了！</div>
    <div class="ov-sub" id="ovSub">今天的药都吃完了~</div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ==== 数据 ====
var SK='med_v4';
var MEDS=[
  {g:'m',id:'escitalopram',nm:'艾司西酞普兰',ds:'10 mg',tm:'早上 9:00 前'},
  {g:'e',id:'olanzapine',nm:'奥氮平',ds:'2.5 mg 起',tm:'晚上 22:00 前'},
  {g:'e',id:'mirtazapine',nm:'米氮平',ds:'15 mg',tm:'晚上 22:00 前'}
];
var WDS=['周日','周一','周二','周三','周四','周五','周六'];

function ld(){try{return JSON.parse(localStorage.getItem(SK))||{};}catch(e){return{};}}
function sv(d){localStorage.setItem(SK,JSON.stringify(d));}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function tds(){return ds(new Date());}
function mk(g,i){return g+'_'+i;}
function pad(n){return n<10?'0'+n:''+n;}

function on(ds,g,i){var d=ld();return!!(d[ds]&&d[ds][mk(g,i)]);}
function tog(ds,g,i){var d=ld();if(!d[ds])d[ds]={};d[ds][mk(g,i)]=!d[ds][mk(g,i)];sv(d);return d[ds][mk(g,i)];}
function dayData(ds){return ld()[ds]||{};}
function daySt(ds){var data=dayData(ds),n=0;for(var j=0;j<MEDS.length;j++){if(data[mk(MEDS[j].g,MEDS[j].id)])n++;}if(n===0)return'empty';if(n===MEDS.length)return'done';return'partial';}

// ==== TAB ====
function goTab(t){
  document.getElementById('tabToday').className=t==='today'?'tab on':'tab';
  document.getElementById('tabCal').className=t==='cal'?'tab on':'tab';
  document.getElementById('paneToday').className=t==='today'?'pane show':'pane';
  document.getElementById('paneCal').className=t==='cal'?'pane show':'pane';
  if(t==='cal'){drawCal();drawStats();}
}

// ==== 今日打卡 ====
function setBtn(g,i,bid){
  var btn=document.getElementById(bid);
  var ok=on(tds(),g,i);
  var now=new Date(),h=now.getHours();
  var late=(g==='m'&&h>=12)||(g==='e'&&((h>=23)||(h<6)));
  if(ok){btn.className='btn btn-yes';btn.textContent='✓';}
  else if(late&&!ok){btn.className='btn btn-late';btn.textContent='!';}
  else{btn.className='btn btn-no';btn.textContent='○';}
}
function refresh(){
  setBtn('m','escitalopram','b_m_esc');
  setBtn('e','olanzapine','b_e_ola');
  setBtn('e','mirtazapine','b_e_mir');
  updProg();
}
function chk(g,i){
  var ok=tog(tds(),g,i);
  if(g==='m')setBtn('m','escitalopram','b_m_esc');
  else if(i==='olanzapine')setBtn('e','olanzapine','b_e_ola');
  else setBtn('e','mirtazapine','b_e_mir');
  updProg();
  if(navigator.vibrate)vibrate([40,20,40]);
  toast(ok?'✅ 已记录':'↩️ 已取消');
  chkCele();
}
function updProg(){
  var n=0;
  for(var i=0;i<MEDS.length;i++){if(on(tds(),MEDS[i].g,MEDS[i].id))n++;}
  document.getElementById('progBar').style.width=(n/MEDS.length*100)+'%';
  document.getElementById('progTxt').textContent=n+' / '+MEDS.length;
}

// ==== 时钟 ====
function tick(){
  var now=new Date(),h=now.getHours(),m=now.getMinutes(),s=now.getSeconds();
  document.getElementById('clkDate').textContent=(now.getMonth()+1)+'月'+now.getDate()+'日 '+WDS[now.getDay()];
  document.getElementById('clkTime').textContent=pad(h)+':'+pad(m)+':'+pad(s);

  var tot=h*60+m,badge=document.getElementById('clkBadge');
  if(tot<540){badge.textContent='🌅 早上吃药时间';badge.className='badge am';}
  else if(tot<1320){badge.textContent='☀️ 白天时段';badge.className='badge day';}
  else{badge.textContent='🌙 晚上吃药时间';badge.className='badge pm';}

  // 倒计时
  var target=tot<540?9:(tot<1320?22:33),diff=target*60-tot;
  if(diff<=0)diff+=1440;
  var hh=Math.floor(diff/60),mm=diff%60,ss=(59-s)%60;
  document.getElementById('cdNum').textContent=pad(hh)+':'+pad(mm)+':'+pad(ss);

  refresh();
}

// ==== 庆祝 ====
function chkCele(){
  var all=true;
  for(var i=0;i<MEDS.length;i++){if(!on(tds(),MEDS[i].g,MEDS[i].id)){all=false;break;}}
  if(!all)return;
  var now=new Date(),tot=now.getHours()*60+now.getMinutes();
  if(tot>=540&&tot<1320&&on(tds(),'m','escitalopram'))cele('🌅','早上药吃完啦！','下午继续加油~');
  else if(tot>=1320&&on(tds(),'e','olanzapine')&&on(tds(),'e','mirtazapine'))cele('🎉','今天全部完成！','好好休息，晚安💤');
}
function cele(e,t,s){
  document.getElementById('ovEmo').textContent=e;
  document.getElementById('ovTxt').textContent=t;
  document.getElementById('ovSub').textContent=s;
  var o=document.getElementById('overlay');o.classList.add('show');
  setTimeout(function(){o.classList.remove('show');},3000);
}

// ==== Toast ====
var toastTimer=null;
function toast(msg){
  var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove('show');},1800);
}

// ==== 日历 ====
var cY=null,cM=null,cSel=null;

function drawCal(){
  if(cY===null){var t=new Date();cY=t.getFullYear();cM=t.getMonth();}
  var fd=new Date(cY,cM,1),ld=new Date(cY,cM+1,0);
  var sdow=(fd.getDay()+6)%7;// 周一=0
  var todayT=tds();
  var ms=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calTitle').textContent=cY+'年 '+ms[cM];

  var h='<tr>';
  for(var i=0;i<7;i++){
    var w=(i>=5)?' we':'';
    h+='<th'+w+'>'+['一','二','三','四','五','六','日'][i]+'</th>';
  }
  h+='</tr>';

  // 上月填充
  var pld=new Date(cY,cM,0).getDate();
  var row=[];
  for(var i=sdow-1;i>=0;i--)row.push('<td><span class="cal-cell gray">'+(pld-i)+'</span></td>');

  // 本月
  for(var d=1;d<=ld.getDate();d++){
    var dss=cY+'-'+pad(cM+1)+'-'+pad(d);
    var isToday=dss===todayT,isSel=dss===cSel,st=daySt(dss);
    var cls='cal-cell';
    if(isToday)cls+=' today';
    if(isSel)cls+=' sel';

    var dotHtml='';
    if(st==='done')dotHtml='<div class="cal-dot"><div class="dot-ok"></div><div class="dot-ok"></div></div>';
    else if(st==='partial')dotHtml='<div class="cal-dot"><div class="dot-py"></div></div>';

    row.push('<td><span class="'+cls+'" onclick="pickDate(\''+dss+'\')">'+d+dotHtml+'</span></td>');
    if(row.length===7){h+='<tr>'+row.join('')+'</tr>';row=[];}
  }
  // 填充末尾
  if(row.length>0){for(var i=row.length;i<7;i++)row.push('<td><span class="cal-cell gray">'+(i-row.length+1)+'</span></td>');h+='<tr>'+row.join('')+'</tr>';}

  document.getElementById('calBody').innerHTML=h;
}

function calGo(dir){
  cM+=dir;
  if(cM>11){cM=0;cY++;}
  if(cM<0){cM=11;cY--;}
  drawCal();
}

function pickDate(ds){
  cSel=ds;
  drawCal();
  drawDetail(ds);
}

function drawDetail(ds){
  var parts=ds.split('-');
  var dd=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
  var st=daySt(ds);

  document.getElementById('dTt').textContent=parseInt(parts[1])+'月'+parseInt(parts[2])+'日 '+WDS[dd.getDay()];
  var se=document.getElementById('dSt');
  se.className='d-st';
  if(st==='done'){se.className+=' d-st-ok';se.textContent='✅ 全部完成';}
  else if(st==='partial'){se.className+=' d-st-py';se.textContent='⚠️ 部分完成';}
  else{se.className+=' d-st-ep';se.textContent='— 无记录';}

  var bh='';
  for(var i=0;i<MEDS.length;i++){
    var m=MEDS[i],ok=on(ds,m.g,m.id),cls=ok?'d-btn-yes':'d-btn-no';
    bh+='<div class="d-item">'+
      '<div class="d-info"><div class="d-name">'+(m.g==='m'?'🌅':'🌙')+' '+m.nm+'</div><div class="d-time">'+m.tm+' · '+m.ds+'</div></div>'+
      '<button class="d-btn '+cls+'" onclick="chkDate(\''+ds+'\',\''+m.g+'\',\''+m.id+'\')">'+(ok?'✓':'○')+'</button>'+
    '</div>';
  }
  document.getElementById('dBd').innerHTML=bh;
}

function chkDate(ds,g,i){
  var ok=tog(ds,g,i);
  drawDetail(ds);
  drawCal();
  drawStats();
  toast(ok?'✅ 补卡成功':'↩️ 已取消');
  if(ds===tds())refresh();
}

// ==== 统计 ====
function drawStats(){
  var ok=0,py=0,no=0;
  var lastD=new Date(cY,cM+1,0).getDate();
  for(var d=1;d<=lastD;d++){
    var dss=cY+'-'+pad(cM+1)+'-'+pad(d);
    if(dss>tds())continue;
    var s=daySt(dss);
    if(s==='done')ok++;
    else if(s==='partial')py++;
    else no++;
  }
  document.getElementById('stOk').textContent=ok;
  document.getElementById('stPy').textContent=py;
  document.getElementById('stNo').textContent=no;
}

// ==== 通知 ====
function setupNotif(){
  if(!('Notification'in window))return;
  if(Notification.permission==='default')Notification.requestPermission();
  if(Notification.permission!=='granted')return;
  function fire(t,b){var n=new Notification(t,{body:b,icon:'icon-192.png',tag:'med'});setTimeout(function(){n.close();},8000);}
  function sch(th,t,b){var x=new Date();x.setHours(th,0,0,0);if(x<=new Date())x.setDate(x.getDate()+1);setTimeout(function(){fire(t,b);},x-new Date());}
  sch(9,'💊 该吃早上的药了！','艾司西酞普兰 10mg');
  sch(22,'💊 该吃晚上的药了！','奥氮平 + 米氮平');
}

// ==== 安装 ====
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();
  deferredPrompt=e;
  document.getElementById('installDesc').textContent='点右侧「安装」按钮即可';
});
document.getElementById('installBtn').addEventListener('click',function(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(r){
      deferredPrompt=null;
      document.getElementById('installBox').style.display='none';
      if(r.outcome==='accepted')toast('🎉 已添加到主屏幕！');
    });
    return;
  }
  var ua=navigator.userAgent.toLowerCase();
  var g='';
  if(ua.indexOf('oppo')>-1||ua.indexOf('heytap')>-1)
    g='①浏览器菜单→②找"添加到桌面"→③找不到请用Chrome打开';
  else if(ua.indexOf('chrome')>-1)
    g='①右上角⋮→②添加到主屏幕→③确认';
  else if(ua.indexOf('safari')>-1)
    g='①分享📤→②添加到主屏幕→③确认';
  else
    g='①浏览器菜单→②找"添加到桌面"';
  document.getElementById('installDesc').textContent=g;
  toast('👇 看下方操作步骤');
});

// ==== Service Worker ====
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});

// ==== 启动 ====
refresh();
tick();
setInterval(tick,1000);
setupNotif();
cSel=tds();

setTimeout(function(){
  if(!deferredPrompt){
    var ua=navigator.userAgent.toLowerCase();
    var g='';
    if(ua.indexOf('oppo')>-1||ua.indexOf('heytap')>-1)
      g='①浏览器菜单→②找"添加到桌面"→③找不到请用Chrome打开';
    else if(ua.indexOf('chrome')>-1)
      g='①右上角⋮→②添加到主屏幕→③确认';
    else
      g='①浏览器菜单→②找"添加到桌面"';
    document.getElementById('installDesc').textContent=g;
  }
},2000);
</script>
